plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Assist Core (shared library), bundled inside this jar.
	implementation project(':core')
	include project(':core')
	// Assist Path: route planning and walking (LGPL-3.0, separate bundled jar)
	implementation project(':path')
	include project(':path')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// Mod Menu API stubs are only for compiling; the real classes come from Mod Menu itself.
	exclude 'com/terraformersmc/**'
}

// Automated in-game tests: ./gradlew runClientGameTest starts a real client, builds a test world and runs the mod.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "buildassist-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
