name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Which suites run. "[quick <plan>]" in the commit message (e.g. [quick pine]): only that plan, four times, with
  # 20 minutes each, and never a release - a fast look at a fix. Otherwise the full set (the release check).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.p.outputs.suites }}
      quick: ${{ steps.p.outputs.quick }}
    steps:
      - id: p
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          q=$(printf '%s' "$MSG" | grep -oE '\[quick [a-z-]+\]' | head -1 | sed -E 's/\[quick ([a-z-]+)\]/\1/')
          if [ -n "$q" ]; then
            echo "suites=[\"flat\",\"build-$q\",\"build-$q-b\",\"build-$q-c\",\"build-$q-d\"]" >> $GITHUB_OUTPUT
            echo "quick=$q" >> $GITHUB_OUTPUT
          else
            echo 'suites=["flat","build-flat","build-flat-turned","build-chest","build-crane","build-pine","build-pine-large","build-crane-b","build-pine-b","build-pine-large-b","build-crane-c","build-pine-c","build-pine-large-c","build-crane-d","build-pine-d","build-pine-large-d","build-pine-medium","build-pine-medium-b","build-pine-medium-c","build-pine-medium-d"]' >> $GITHUB_OUTPUT
            echo "quick=" >> $GITHUB_OUTPUT
          fi

  # Each test suite runs in its own job, all at the same time: "flat" is the prepared test field,
  # "real-..." are runs in a normally generated world (see RealWorld in the game tests).
  test:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: game test
        id: gametest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 80
        env:
          ASSIST_GT: ${{ matrix.suite }}
          ASSIST_QUICK: ${{ needs.plan.outputs.quick }}
          ASSIST_NO_PATH: ${{ endsWith(matrix.suite, '-nopath') && '1' || '' }}
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils > /dev/null
          # Game assets come from Mojang's servers: retry a failed download before the test.
          ./gradlew downloadAssets > /dev/null 2>&1 || (sleep 15; ./gradlew downloadAssets > /dev/null 2>&1) || (sleep 30; ./gradlew downloadAssets) || true
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee gametest.log
      - name: collect
        if: always()
        run: |
          mkdir -p out/shots out/jars
          echo "${{ steps.build.outcome }}" > out/build-outcome.txt
          o="${{ steps.gametest.outcome }}"; [ -z "$o" ] && o=failure
          echo "$o" > out/outcome.txt
          [ -f build.log ] && grep -E "error:|warning:|\.java:[0-9]+|What went wrong|^> |Caused by|Exception" build.log | head -400 > out/errors.txt || true
          [ -f build.log ] && grep -A6 "error:" build.log | head -300 > out/compile.txt || true
          [ -f build.log ] && tail -300 build.log > out/tail.txt || true
          [ -f gametest.log ] && grep -E -A3 "error:|ERROR|Exception|FAIL|Caused by|at com.seolwoni|AssertionError|What went wrong|^> " gametest.log | head -300 > out/gt-errors.txt || true
          [ -f gametest.log ] && tail -200 gametest.log > out/gt-tail.txt || true
          find . -name "*-test-result.txt" -not -path "./.git/*" -not -path "./out/*" -exec cp {} out/ \; 2>/dev/null || true
          find . \( -name "*.png" -o -name "*.gif" \) -path "*screenshots*" -not -path "./.git/*" -not -path "./out/*" -exec cp {} out/shots/ \; 2>/dev/null || true
          LOG=$(find . -name "latest.log" -path "*run*" -not -path "./.git/*" | head -1); [ -n "$LOG" ] && tail -400 "$LOG" > out/gt-latest.txt || true
          if [ "${{ matrix.suite }}" = "flat" ]; then
            cp build/libs/*.jar out/jars/ 2>/dev/null || true
            JAR=$(find ~/.gradle .gradle -name "minecraft-merged.jar" 2>/dev/null | head -1)
            [ -z "$JAR" ] && JAR=$(find ~/.gradle .gradle -name "minecraft-*.jar" -size +5M 2>/dev/null | grep -v sources | head -1)
            echo "jar: $JAR" > out/sigs.txt
            for c in $(cat .github/sigs.txt 2>/dev/null); do javap -p -cp "$JAR" $c >> out/sigs.txt 2>&1 || true; done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-${{ matrix.suite }}
          path: out/

  publish:
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gt-*
          path: arts
      - name: assemble log
        id: log
        run: |
          mkdir -p /tmp/log/gt
          overall=success
          QUICK="${{ needs.plan.outputs.quick }}"
          SUITES=$(echo '${{ needs.plan.outputs.suites }}' | tr -d '[]"' | tr ',' ' ')
          for s in $SUITES; do
            d=arts/gt-$s
            o=$(cat $d/outcome.txt 2>/dev/null || echo failure)
            echo "$s: $o" >> /tmp/log/gt/suites.txt
            # "-nopath" runs are only for comparison: they do not hold back a release.
            case "$s" in flat|build-flat|build-flat-turned|build-chest) [ "$o" = "success" ] || overall=failure ;; *) ;; esac
            [ -n "$QUICK" ] && overall=failure # a quick look never releases
            if [ "$s" = "flat" ]; then
              cp $d/errors.txt $d/compile.txt $d/tail.txt $d/sigs.txt /tmp/log/ 2>/dev/null || true
              cp -r $d/shots /tmp/log/gt/ 2>/dev/null || true
              cp $d/*.txt /tmp/log/gt/ 2>/dev/null || true
            else
              mkdir -p /tmp/log/gt/$s
              cp -r $d/* /tmp/log/gt/$s/ 2>/dev/null || true
              rm -rf /tmp/log/gt/$s/jars
            fi
          done
          # The player's plans: all their runs together must place at least 90% of what the last good version did
          # (one run alone varies by up to a third, so the total is what counts). Below that: no release.
          base=$(grep -v '^#' .github/plan-baseline.txt 2>/dev/null | head -1)
          total=0
          for s in $SUITES; do
            case "$s" in flat|build-flat|build-flat-turned|build-chest) continue ;; esac
            n=$(grep -ohE "blocks as planned [0-9]+" arts/gt-$s/*test-result.txt 2>/dev/null | head -1 | grep -oE "[0-9]+$" || echo 0)
            total=$((total + ${n:-0}))
          done
          # Four runs of each plan (one run varies by up to a third): the total is given per two runs of each
          # (half of all), so it compares with the baseline and with the numbers from before (two runs each).
          total=$((total / 2))
          if [ -n "$QUICK" ]; then
            echo "quick look at $QUICK: $total blocks per two runs (4 runs, halved; 20 minutes each; no release)" >> /tmp/log/gt/suites.txt
          else
          echo "plans: $total blocks placed per two runs of each plan (4 runs each, halved; baseline ${base:-none})" >> /tmp/log/gt/suites.txt
          fi
          if [ -z "$QUICK" ] && [ -n "$base" ] && [ $((total * 10)) -lt $((base * 9)) ]; then
            echo "plans: below 90% of the baseline, no release" >> /tmp/log/gt/suites.txt
            overall=failure
          fi
          echo "$overall" > /tmp/log/gt/outcome.txt
          echo "overall=$overall" >> $GITHUB_OUTPUT
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          git clean -fdq -e arts
          cp -r /tmp/log/* .
          git add -A -- . ':!arts'
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-log
      - name: release notes
        run: |
          git checkout -q ${{ github.sha }} -- CHANGELOG.md gradle.properties
          VER=$(grep '^version=' gradle.properties | cut -d= -f2)
          awk -v v="## $VER" '$0 ~ "^## " { if (p) exit; if (index($0, v) == 1) p = 1 } p' CHANGELOG.md > release-notes.md
          printf '\n---\nFabric 26.2용. 아래 jar 파일을 받아 mods 폴더에 넣으세요. (Fabric API 필요, Mod Menu 권장)\n' >> release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: buildassist-jar
          path: arts/gt-flat/jars/
      - name: release
        if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no release]') && steps.log.outputs.overall == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build Assist (build ${{ github.run_number }})
          body_path: release-notes.md
          files: arts/gt-flat/jars/*.jar
